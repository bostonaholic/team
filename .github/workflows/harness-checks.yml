# Harness checks — runs on every PR to main.
#
# Validates the eval harness itself: unit tests for the TS helpers
# (parsers, storage, selection, judging), schema validation of every
# fixture and rubric on disk, and an offline subprocess replay of the
# code-reviewer scoring pipeline (tests/code-reviewer-replay.test.ts).
# No model calls, no EVALS_ANTHROPIC_API_KEY; the free suite runs in
# about seven seconds.
#
# Live agent runs against the model live in periodic-evals.yml.
name: Harness checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Key on the PR number (never the attacker-controlled branch name) so a
  # crafted head_ref can't collide with or cancel another PR's group.
  group: harness-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  harness-checks:
    name: Validate harness + fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Author gate contract (issue #51): the steps below are free (no secret,
    # no `claude` spawn), so the job itself stays UNGATED — fork authors keep
    # free CI. But any step that consumes a secret or spawns `claude` MUST
    # carry this trust `if:`:
    #   contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    # When PR #32's "Run gate-tier evals" step attaches paid execution here,
    # it inherits this gate so untrusted PR authors never spend tokens.
    # Canonical in-use example: periodic-evals.yml wires exactly this
    # allowlist into a live job-level `if:` (wrapped event-aware with
    # startsWith(github.event_name, 'pull_request')) — copy that form when
    # adding the paid step here.
    #
    # The offline replay test (tests/code-reviewer-replay.test.ts) spawns
    # child `bun test` runs that would reach a `claude` spawn only if their
    # mock seam broke. Two guards fail first: the agent seam in
    # tests/helpers/session-runner.ts throws "refusing live spawn", and the
    # judge seam in tests/helpers/llm-judge.ts throws
    # "EVALS_ANTHROPIC_API_KEY is required for the LLM-judge tier". So the
    # step consumes no secret, spawns no `claude`, and stays inside the
    # free contract above.
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 — diff-based test selection compares against origin/main.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check harness
        # `bun test` transpiles without type-checking, so type errors pass it
        # silently. `tsc --noEmit` is the cheapest deterministic gate (static,
        # free) and blocks the PR on any type error — see docs/testing.md.
        run: bun run typecheck

      - name: Run harness checks
        # Paid agent-behavior files are named *.evals.ts — outside Bun's
        # auto-discovery pattern (*.test.{ts,js,...}) — so `bun test`
        # with no args never loads them.
        run: bun test
