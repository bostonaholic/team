name: team

up:
  - claude-code
  - custom:
      name: playwright-cli
      met?: "npx --no-install playwright-cli --version 2>/dev/null"
      meet: "npm install -g @playwright/cli@latest && playwright-cli install --skills"
  - custom:
      name: python3
      met?: "python3 --version >/dev/null 2>&1"
      meet: "brew install python3"

check:
  plugin: "claude plugin validate ."
  typecheck: "bun run typecheck"

test:
  run: "bun test"
  desc: "Run the test suite (bun test)"

commands:
  install:
    run: "script/dev-install"
    desc: "Install this checkout into every supported harness"
    subcommands:
      claude: "script/dev-install claude"
      codex: "script/dev-install codex"
  uninstall:
    run: "script/dev-uninstall"
    desc: "Uninstall this checkout from every supported harness"
    subcommands:
      claude: "script/dev-uninstall claude"
      codex: "script/dev-uninstall codex"
  docs:
    desc: "Build and serve the docs site locally at http://localhost:4000"
    run: "cd docs && bundle config set --local path 'vendor/bundle' && bundle install && bundle exec jekyll serve --livereload"
  evals:
    desc: "Run the paid behavioral evals — live agent runs + LLM judge (requires EVALS_ANTHROPIC_API_KEY; spends real money)"
    run: "bun run test:evals"

open:
  docs: "http://localhost:4000"
  site: "https://team.bostonaholic.dev"
